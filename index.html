<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Palestinian Automotive Showroom</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="css/styles.css" rel="stylesheet">
</head>
<body>
  <header class="topbar">
    <div class="container topbar-inner">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">P</span>
        <span class="brand-name">Showroom</span>
      </div>
      <div class="d-flex align-items-center gap-3">
        <span class="brand-team">Chery  |  OMODA  |  JAECOO</span>
        <button type="button" id="addVehicleButton" class="btn btn-primary btn-sm">+ Add vehicle</button>
      </div>
    </div>
  </header>

  <main class="container py-4">
    <section class="summary" aria-label="Inventory summary">
      <div class="metric"><span class="metric-value" id="statTotal">0</span><span class="metric-label">Total vehicles</span></div>
      <div class="metric metric-available"><span class="metric-value" id="statAvailable">0</span><span class="metric-label">Available</span></div>
      <div class="metric metric-reserved"><span class="metric-value" id="statReserved">0</span><span class="metric-label">Reserved</span></div>
      <div class="metric metric-sold"><span class="metric-value" id="statSold">0</span><span class="metric-label">Sold</span></div>
    </section>

    <section class="panel filters" aria-label="Search and filters">
      <div class="row g-3 align-items-end">
        <div class="col-lg-3 col-md-6">
          <label for="searchInput" class="form-label">Search</label>
          <input type="search" id="searchInput" class="form-control" placeholder="Brand or model" autocomplete="off">
        </div>
        <div class="col-lg-2 col-md-3 col-6">
          <label for="brandFilter" class="form-label">Brand</label>
          <select id="brandFilter" class="form-select"></select>
        </div>
        <div class="col-lg-2 col-md-3 col-6">
          <label for="statusFilter" class="form-label">Status</label>
          <select id="statusFilter" class="form-select"></select>
        </div>
        <div class="col-lg-1 col-md-3 col-6">
          <label for="minPrice" class="form-label">Min $</label>
          <input type="number" id="minPrice" class="form-control" min="0" placeholder="0">
        </div>
        <div class="col-lg-1 col-md-3 col-6">
          <label for="maxPrice" class="form-label">Max $</label>
          <input type="number" id="maxPrice" class="form-control" min="0" placeholder="Any">
        </div>
        <div class="col-lg-2 col-md-4 col-8">
          <label for="sortSelect" class="form-label">Sort by</label>
          <select id="sortSelect" class="form-select">
            <option value="year-desc">Year: newest</option>
            <option value="year-asc">Year: oldest</option>
            <option value="price-asc">Price: low to high</option>
            <option value="price-desc">Price: high to low</option>
          </select>
        </div>
        <div class="col-lg-1 col-md-2 col-4">
          <button type="button" id="resetFilters" class="btn-soft w-100">Reset</button>
        </div>
      </div>
    </section>

    <p id="resultCount" class="result-count" aria-live="polite"></p>
    <section id="vehicleGrid" class="vehicle-grid" aria-label="Vehicles"></section>
  </main>

  <dialog id="formDialog" class="dialog">
    <form id="vehicleForm" novalidate>
      <h2 id="formTitle" class="dialog-title">Add vehicle</h2>
      <div class="row g-3">
        <div class="col-sm-6">
          <label for="brand" class="form-label">Brand</label>
          <select id="brand" class="form-select" aria-describedby="brandError"></select>
          <div id="brandError" class="field-error" role="alert"></div>
        </div>
        <div class="col-sm-6">
          <label for="model" class="form-label">Model</label>
          <input type="text" id="model" class="form-control" autocomplete="off" aria-describedby="modelError">
          <div id="modelError" class="field-error" role="alert"></div>
        </div>
        <div class="col-sm-4">
          <label for="year" class="form-label">Year</label>
          <input type="number" id="year" class="form-control" aria-describedby="yearError">
          <div id="yearError" class="field-error" role="alert"></div>
        </div>
        <div class="col-sm-4">
          <label for="price" class="form-label">Price ($)</label>
          <input type="number" id="price" class="form-control" min="0" aria-describedby="priceError">
          <div id="priceError" class="field-error" role="alert"></div>
        </div>
        <div class="col-sm-4">
          <label for="color" class="form-label">Color</label>
          <input type="text" id="color" class="form-control" autocomplete="off" aria-describedby="colorError">
          <div id="colorError" class="field-error" role="alert"></div>
        </div>
        <div class="col-sm-4">
          <label for="transmission" class="form-label">Transmission</label>
          <select id="transmission" class="form-select" aria-describedby="transmissionError"></select>
          <div id="transmissionError" class="field-error" role="alert"></div>
        </div>
        <div class="col-sm-4">
          <label for="fuelType" class="form-label">Fuel type</label>
          <select id="fuelType" class="form-select" aria-describedby="fuelTypeError"></select>
          <div id="fuelTypeError" class="field-error" role="alert"></div>
        </div>
        <div class="col-sm-4">
          <label for="status" class="form-label">Status</label>
          <select id="status" class="form-select" aria-describedby="statusError"></select>
          <div id="statusError" class="field-error" role="alert"></div>
        </div>
        <div class="col-sm-4">
          <label for="mileage" class="form-label">Mileage (km)</label>
          <input type="number" id="mileage" class="form-control" min="0" aria-describedby="mileageError">
          <div id="mileageError" class="field-error" role="alert"></div>
        </div>
        <div class="col-sm-8">
          <label for="imageUrl" class="form-label">Image link <span class="optional">optional</span></label>
          <input type="url" id="imageUrl" class="form-control" autocomplete="off" aria-describedby="imageUrlError">
          <div id="imageUrlError" class="field-error" role="alert"></div>
        </div>
        <div class="col-12">
          <label for="description" class="form-label">Notes <span class="optional">optional</span></label>
          <textarea id="description" class="form-control" rows="2" maxlength="200"></textarea>
        </div>
      </div>
      <div class="dialog-actions">
        <button type="button" id="cancelForm" class="btn-soft">Cancel</button>
        <button type="submit" id="submitButton" class="btn btn-primary">Add vehicle</button>
      </div>
    </form>
  </dialog>

  <dialog id="detailsDialog" class="dialog">
    <div id="detailsBody"></div>
  </dialog>

  <dialog id="confirmDialog" class="dialog dialog-small">
    <h2 class="dialog-title">Delete vehicle</h2>
    <p id="confirmText" class="mb-0"></p>
    <div class="dialog-actions">
      <button type="button" id="confirmCancel" class="btn-soft">Cancel</button>
      <button type="button" id="confirmDelete" class="btn-soft btn-soft-danger">Delete</button>
    </div>
  </dialog>

  <div id="messages" class="toast-area"></div>
  <script type="module" src="dist/main.js"></script>
</body>
</html>
